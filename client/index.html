<!doctype html>
<html lang="en" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FF6B00" />

    <!-- iOS Safari PWA — prevents "A problem repeatedly occurred" crash -->
    <!-- These tags make iOS treat the site as a full-screen native app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Use 'default' (not black-translucent) so status bar doesn't overlap content -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NB Shop" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Prevent iOS from phone-number detection (can cause layout crashes) -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Primary Meta Tags -->
    <title>NB Shop - Your Nearby Grocery Store</title>
    <meta name="description" content='M/s NAVARAM BHUBAJI - "सभी प्रकार की किराना & प्रोविजनल आइटम्स उपलब्ध..."' />

    <!-- Open Graph / WhatsApp / Telegram / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NB Shop" />
    <meta property="og:title" content="NB Shop - Your Nearby Grocery Store" />
    <meta property="og:description" content='M/s NAVARAM BHUBAJI - "सभी प्रकार की किराना & प्रोविजनल आइटम्स उपलब्ध..."' />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NB Shop - Your Nearby Grocery Store" />
    <meta name="twitter:description" content='M/s NAVARAM BHUBAJI - "सभी प्रकार की किराना & प्रोविजनल आइटम्स उपलब्ध..."' />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <!-- Preconnect to external hosts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://clerk.com" crossorigin />
    <link rel="preconnect" href="https://img.clerk.com" crossorigin />

    <!-- Google Fonts — non-blocking (media trick) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- Inline critical CSS + Netflix-style Splash Screen -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;background:#0D0D0D;font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
      html.splash-active, body.splash-active{overflow:hidden !important;height:100vh !important;width:100vw !important}
      #root{min-height:100%}

      /* Netflix-style Splash Overlay */
      #nb-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #261200 0%, #0A0500 70%, #000000 100%);
        z-index: 9999;
        overflow: hidden;
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Exit Animation (Zoom Out Reveal like Netflix) */
      #nb-splash.fade-out {
        opacity: 0;
        transform: scale(1.22);
        pointer-events: none;
      }

      /* Subtle background ambient pulse */
      .nb-bg-glow {
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(255,107,0,0.4) 0%, rgba(255,107,0,0) 70%);
        border-radius: 50%;
        animation: bg-pulse 3.5s ease-in-out infinite alternate;
        pointer-events: none;
      }

      /* Logo container with Netflix pop & glow */
      .nb-logo-container {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: netflix-pop 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
      }

      .nb-logo-img {
        width: 120px;
        height: 120px;
        border-radius: 32px;
        object-fit: cover;
        box-shadow: 0 20px 60px rgba(255, 107, 0, 0.6), 0 0 30px rgba(255, 154, 0, 0.4);
        animation: logo-glow 3s ease-in-out infinite alternate;
      }

      /* Typography with tracking expansion */
      .nb-title {
        font-size: 36px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: 2px;
        margin-top: 24px;
        text-transform: uppercase;
        animation: text-expand 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .nb-title span {
        color: #FF6B00;
        text-shadow: 0 0 22px rgba(255, 107, 0, 0.75);
      }

      .nb-sub {
        font-size: 14px;
        font-weight: 600;
        color: #B0B0B0;
        letter-spacing: 1.2px;
        margin-top: 8px;
        opacity: 0;
        animation: fade-up 1.2s ease forwards 0.7s;
      }

      /* Netflix-style cinematic progress bar */
      .nb-loader-bar {
        position: absolute;
        bottom: 50px;
        width: 160px;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 99px;
        overflow: hidden;
      }

      .nb-loader-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #FF6B00, #FFA800, #FF6B00);
        background-size: 200% 100%;
        border-radius: 99px;
        animation: load-fill 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite, shimmer 1.5s linear infinite;
      }

      /* Animations */
      @keyframes netflix-pop {
        0% { transform: scale(0.3); opacity: 0; filter: blur(14px); }
        100% { transform: scale(1); opacity: 1; filter: blur(0px); }
      }

      @keyframes text-expand {
        0% { letter-spacing: -4px; opacity: 0; }
        100% { letter-spacing: 5px; opacity: 1; }
      }

      @keyframes fade-up {
        0% { transform: translateY(14px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }

      @keyframes logo-glow {
        0% { box-shadow: 0 14px 40px rgba(255, 107, 0, 0.4); transform: scale(1); }
        100% { box-shadow: 0 24px 70px rgba(255, 107, 0, 0.85), 0 0 40px rgba(255, 154, 0, 0.6); transform: scale(1.05); }
      }

      @keyframes bg-pulse {
        0% { transform: scale(0.8); opacity: 0.35; }
        100% { transform: scale(1.4); opacity: 0.95; }
      }

      @keyframes load-fill {
        0% { width: 0%; }
        65% { width: 80%; }
        100% { width: 100%; }
      }

      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body class="splash-active">
    <!-- Netflix-style Splash Screen -->
    <div id="nb-splash">
      <div class="nb-bg-glow"></div>
      <div class="nb-logo-container">
        <img src="/logo.jpg" alt="NB Shop Logo" class="nb-logo-img" />
        <div class="nb-title">NB <span>SHOP</span></div>
        <div class="nb-sub">Your Nearby Grocery Store</div>
      </div>
      <div class="nb-loader-bar">
        <div class="nb-loader-fill"></div>
      </div>
    </div>

    <div id="root"></div>

    <!-- EMERGENCY: Unregister any broken/old Service Worker before React loads.
         This runs synchronously before main.jsx so stale SWs can't intercept. -->
    <script>
      (function() {
        // SW version stamp — increment this to force-kill old SWs on all clients
        var SW_VERSION = 'v6';
        var SW_KEY = 'nb_sw_version';
        var storedVersion = localStorage.getItem(SW_KEY);

        if (storedVersion !== SW_VERSION && 'serviceWorker' in navigator) {
          // Unregister ALL old service workers
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            var unregisterPromises = registrations.map(function(r) { return r.unregister(); });
            return Promise.all(unregisterPromises);
          }).then(function() {
            // Clear ALL caches
            if ('caches' in window) {
              return caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              });
            }
          }).then(function() {
            localStorage.setItem(SW_KEY, SW_VERSION);
            // Hard reload to pick up fresh SW — only once
            window.location.reload();
          }).catch(function() {
            localStorage.setItem(SW_KEY, SW_VERSION);
          });
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Fade out & remove splash screen once React mounts (with minimum 3.2s cinematic timing) -->
    <script>
      (function() {
        var startTime = Date.now();
        var MIN_SPLASH_TIME = 3200; // 3.2 seconds minimum display

        function dismissSplash() {
          var splash = document.getElementById('nb-splash');
          if (!splash || splash.classList.contains('fade-out')) return;
          var elapsed = Date.now() - startTime;
          var remaining = Math.max(0, MIN_SPLASH_TIME - elapsed);

          setTimeout(function() {
            splash.classList.add('fade-out');
            document.documentElement.classList.remove('splash-active');
            document.body.classList.remove('splash-active');
            setTimeout(function(){ splash.remove(); }, 800);
          }, remaining);
        }

        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            dismissSplash();
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });

        // Safety fallback — remove splash after 7s max
        setTimeout(function(){
          dismissSplash();
        }, 7000);
      })();
    </script>
  </body>
</html>
